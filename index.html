<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Терминал</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    background: #000;
    color: #7dff7d;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    line-height: 1.5;
    transition: opacity 0.45s ease;
    display: flex;
    flex-direction: column;
  }
  #term {
    flex: 1;
    overflow-y: auto;
    white-space: pre-wrap;
    padding: 24px 24px 8px;
  }
  .muted { color: #3f7a3f; }
  .err   { color: #ff5c5c; }
  .ok    { color: #b6ff7d; }
  .bar   { color: #7dff7d; }
  .line  { margin: 0; }

  #bottom {
    border-top: 1px solid #1c3a1c;
    padding: 12px 24px 20px;
    background: #000;
  }
  .prompt-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }
  .prompt-sign { color: #7dff7d; }

  input, button {
    background: #000;
    color: #7dff7d;
    border: 1px solid #2f5f2f;
    font-family: inherit;
    font-size: 16px;
    padding: 6px 10px;
    outline: none;
  }
  input { flex: 1; }
  input:disabled, button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: #0e1a0e; }
  .hidden { display: none; }

  body.fade-out { opacity: 0; }
  body.fade-in  { opacity: 1; }
</style>
</head>
<body>

<div id="term"></div>

<div id="bottom">
  <div id="team-row" class="prompt-row hidden">
    <span class="prompt-sign">&gt;</span>
    <input id="team-input" placeholder="название команды" autocomplete="off" />
  </div>

  <div id="start-row" class="prompt-row hidden">
    <button id="start-btn">Запустить последовательность</button>
  </div>

  <div id="agent-row" class="prompt-row hidden">
    <span class="prompt-sign">&gt;</span>
    <input id="agent-input" placeholder="agent_id" autocomplete="off" />
    <button id="agent-btn">Проверить</button>
  </div>
</div>

<script>
/* ================== терминал ================== */
const term = document.getElementById('term');
const body = document.body;

function log(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.textContent = text;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ================== boot ================== */
const BOOT_LINES = [
  '[ OK ] Инициализация протокола...',
  '[ OK ] Проверка целостности ядра...',
  '[ .. ] Загрузка модулей шифрования...',
  '[ OK ] Модули шифрования загружены.',
  '[ OK ] Проверка каналов связи...',
  '[ .. ] Подключение к архиву...',
  '[ OK ] Архив доступен.',
  '[ OK ] Подготовка терминала...',
];

async function drawBar(duration = 2400, width = 28) {
  const line = document.createElement('div');
  line.className = 'line bar';
  term.appendChild(line);
  const steps = 28;
  const stepTime = duration / steps;
  for (let i = 0; i <= steps; i++) {
    const filled = Math.round((i / steps) * width);
    const empty = width - filled;
    const pct = Math.round((i / steps) * 100);
    line.textContent =
      '[' + '█'.repeat(filled) + '░'.repeat(empty) + '] ' +
      String(pct).padStart(3, ' ') + '%';
    term.scrollTop = term.scrollHeight;
    await sleep(stepTime);
  }
}

async function boot() {
  for (const line of BOOT_LINES) {
    log(line, line.includes('[ OK ]') ? 'ok' : 'muted');
    await sleep(320);              // было 200 — стало 320
  }
  log('');
  await drawBar(2400);             // было 1500 — стало 2400
  await sleep(450);
  log('');
  log('[ OK ] Загрузка завершена.', 'ok');
  await sleep(650);                // было 450 — стало 650

  body.classList.add('fade-out');
  await sleep(700);                // было 600 — стало 700

  term.innerHTML = '';
  body.classList.remove('fade-out');
  body.classList.add('fade-in');
  await sleep(700);

  await postBoot();
}

/* ================== после «перезагрузки» ================== */
async function postBoot() {
  await sleep(350);
  log('Добро пожаловать, претендент');
  await sleep(450);
  log('Введите имя команды');
  document.getElementById('team-row').classList.remove('hidden');
  document.getElementById('team-input').focus();
}

/* ================== ввод имени команды ================== */
const teamInput = document.getElementById('team-input');
teamInput.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const name = teamInput.value.trim();
  if (!name) return;

  localStorage.setItem('team_name', name);
  document.getElementById('team-row').classList.add('hidden');
  log('> ' + name);
  document.getElementById('start-row').classList.remove('hidden');
});

/* ================== утилиты ================== */
async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(hash)]
    .map((b) => b.toString(16).padStart(2, '0'))
    .join('');
}

async function makeAgentId(name) {
  // соль + префикс, чтобы id не был чистым хэшем имени
  return sha256Hex('agent::' + name + '::v1');
}

function randomHex(len = 32) {
  const bytes = new Uint8Array(len / 2);
  crypto.getRandomValues(bytes);
  return [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
}

function storeAgentId(id) {
  let cookieOk = false;
  try {
    // настоящая кука
    document.cookie =
      'agent_id=' + encodeURIComponent(id) +
      '; path=/; max-age=86400; SameSite=Lax';
    // фейковые куки-приманки
    document.cookie =
      'agent_im=' + encodeURIComponent(randomHex(24)) +
      '; path=/; max-age=86400; SameSite=Lax';
    document.cookie =
      'client_id=' + encodeURIComponent(randomHex(24)) +
      '; path=/; max-age=86400; SameSite=Lax';
    cookieOk = document.cookie.includes('agent_id=');
  } catch (_) {}

  // fallback в localStorage
  localStorage.setItem('agent_id', id);
  localStorage.setItem('agent_im', randomHex(24));
  localStorage.setItem('client_id', randomHex(24));

  return cookieOk ? 'cookie' : 'storage';
}

function readAgentId() {
  const m = document.cookie.match(/(?:^|;\s*)agent_id=([^;]+)/);
  if (m) return decodeURIComponent(m[1]);
  return localStorage.getItem('agent_id');
}

/* ================== запуск последовательности ================== */
document.getElementById('start-btn').addEventListener('click', async () => {
  const name = localStorage.getItem('team_name') || '';
  if (!name) return;

  document.getElementById('start-row').classList.add('hidden');
  log('');
  log('[ .. ] Формирование идентификатора...', 'muted');

  const agentId = await makeAgentId(name);
  storeAgentId(agentId);

  await sleep(500);
  log('[ OK ] Последовательность запущена.', 'ok');
  await sleep(400);
  log('');
  log('Введите agent_id');
  document.getElementById('agent-row').classList.remove('hidden');
  document.getElementById('agent-input').focus();
});

/* ================== защита: попытки и блокировка ================== */
const MAX_ATTEMPTS = 3;
const LOCK_SECONDS = 60;

let attemptsLeft = MAX_ATTEMPTS;
let locked = false;

const agentInput = document.getElementById('agent-input');
const agentBtn = document.getElementById('agent-btn');

function setLockUI(isLocked) {
  agentInput.disabled = isLocked;
  agentBtn.disabled = isLocked;
  if (!isLocked) agentInput.focus();
}

async function startLockout() {
  locked = true;
  setLockUI(true);

  log('', '');
  log('Защитная блокировка', 'err');

  let remaining = LOCK_SECONDS;
  const line = document.createElement('div');
  line.className = 'line err';
  term.appendChild(line);

  const tick = () => {
    const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
    const ss = String(remaining % 60).padStart(2, '0');
    line.textContent = 'До снятия блокировки: ' + mm + ':' + ss;
    term.scrollTop = term.scrollHeight;
  };
  tick();

  while (remaining > 0) {
    await sleep(1000);
    remaining--;
    tick();
  }

  line.textContent = 'Блокировка снята.';
  line.className = 'line ok';

  locked = false;
  attemptsLeft = MAX_ATTEMPTS;
  setLockUI(false);
}

async function checkAgent() {
  if (locked) return;

  const typed = agentInput.value.trim();
  const stored = readAgentId();

  if (!stored) {
    log('> Идентификатор не найден.', 'err');
    return;
  }

  if (typed === stored) {
    log('ОК', 'ok');
    document.getElementById('agent-row').classList.add('hidden');
    localStorage.setItem('agent_ok', '1');
    agentInput.value = '';
    return;
  }

  // неверный id
  attemptsLeft--;
  if (attemptsLeft > 0) {
    log('> Неверный agent_id. Попыток до блокировки: ' + attemptsLeft, 'err');
    agentInput.value = '';
    agentInput.focus();
  } else {
    log('> Неверный agent_id. Попыток до блокировки: 0', 'err');
    agentInput.value = '';
    await startLockout();
  }
}

agentBtn.addEventListener('click', checkAgent);
agentInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkAgent();
});

/* ================== старт ================== */
boot();
</script>
</body>
</html>
